    </p>

    </p>
    <h2 class="text-2xl font-bold mb-4 mt-8">文件类型</h2>
    <p class="text-gray-400 leading-relaxed mb-4">
      M3U8分为直播播放列表和点播播放列表。直播文件是动态更新的，而点播文件是固定的。
    </p>
    <h2 class="text-2xl font-bold mb-4 mt-8">使用场景</h2>
